name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # --legacy-peer-deps: the npm 10 arborist has a known crash on this
      # dependency graph ("edgesOut of null"). Harmless here, and it keeps CI
      # from failing on a resolver bug rather than on our code.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build-only
